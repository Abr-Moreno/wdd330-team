<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="/css/style.css" />
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>
  <main class="divider checkout">
    <h2>Review & Place your Order</h2>
    <section class="checkout-form">
      <form name="checkout">

        <fieldset>
          <legend>Shipping</legend>
          <div class="checkout__name">
            <label for="fname">First Name</label>
            <input id="fname" name="fname" type="text" required minlength="2" maxlength="30" pattern="[A-Za-zÀ-ÿ' -]+"
              title="Enter a valid first name." />

            <label for="lname">Last Name</label>
            <input id="lname" name="lname" type="text" required minlength="2" maxlength="30" pattern="[A-Za-zÀ-ÿ' -]+"
              title="Enter a valid last name." />
          </div>

          <div class="checkout__address">
            <label for="street">Street</label>
            <input id="street" name="street" type="text" required minlength="3" maxlength="100" />

            <label for="city">City</label>
            <input id="city" name="city" type="text" required minlength="2" maxlength="50" pattern="[A-Za-zÀ-ÿ .'-]+"
              title="Enter a valid city." />

            <label for="state">State</label>
            <input id="state" name="state" type="text" required pattern="[A-Za-z]{2}" maxlength="2" minlength="2"
              title="Enter a two-letter state abbreviation (e.g. ID)." />

            <label for="zip">Zip</label>
            <input id="zip" name="zip" type="text" required pattern="[0-9]{5}(-[0-9]{4})?"
              title="Enter a 5-digit ZIP code or ZIP+4." />
          </div>
        </fieldset>

        <fieldset>
          <legend>Payment</legend>

          <label for="cardNumber">Card number</label>
          <input id="cardNumber" name="cardNumber" type="text" required inputmode="numeric" pattern="[0-9]{13,19}"
            title="Enter a valid card number (13–19 digits)." />

          <label for="expiration">Expiration</label>
          <input id="expiration" name="expiration" type="text" required pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
            placeholder="MM/YY" title="Enter expiration in MM/YY format." />

          <label for="code">Security Code</label>
          <input id="code" name="code" type="text" required inputmode="numeric" pattern="[0-9]{3,4}"
            title="Enter a 3 or 4 digit security code." />
        </fieldset>

        <fieldset class="checkout-summary">
          <legend>Order Summary</legend>
          <ul>
            <li>
              <label for="cartTotal">Item Subtotal(<span id="num-items"></span>)</label>
              <p name="cartTotal" id="cartTotal"></p>
            </li>
            <li>
              <label for="shipping">Shipping Estimate</label>
              <p id="shipping"></p>
            </li>
            <li>
              <label for="tax">Tax</label>
              <p id="tax"></p>
            </li>
            <li>
              <label for="orderTotal"><b>Order Total</b></label>
              <p id="orderTotal"></p>
            </li>
          </ul>
        </fieldset>

        <button id="checkoutSubmit" type="submit">Checkout</button>
      </form>
    </section>
  </main>
  <footer id="main-footer"></footer>
</body>

</html>
